info:
  name: Review Action Plan - ESP Approve
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/v1/well-surveilence/action-plans/:source/:id/review"
  params:
    - name: source
      value: "pep"
      type: path
    - name: id
      value: "{{plan_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "decision": "approve",
        "remarks": "OK, jalankan sesuai jadwal",
        "execution_department_id": "Production Operations",
        "execution_pic_id": "{{pic_id}}"
      }
  auth:
    type: bearer
    token: "{{po_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Approve
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/:source/:id/review"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "action_plan_id": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
              "source": "pep",
              "work_order_number": "0005/WO/SDA1/2026",
              "approval_status": "approved",
              "cycle_no": 1,
              "path": "approve",
              "current_level": null,
              "total_levels": null
            },
            "status": "success",
            "code": "00",
            "message": "Review action plan succeed"
          }

docs: |
  Sama dengan artificial lift existing: `execution_department_id` dan `execution_pic_id` opsional. SSDP mendapat notifikasi.
