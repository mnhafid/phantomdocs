info:
  name: Submit Action Plan PEP - ESP Installation Update
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
  body:
    type: json
    data: |-
      {
        "action_plan_type": "artificial_lift",
        "draft_id": null,
        "well_id": "{{well_id}}",
        "wo_number": "{{wo_number}}",
        "start_date": "2026-12-14",
        "end_date": "2026-12-16",
        "pic_ids": [
          "{{pic_id}}"
        ],
        "notes": "ESP installation update",
        "ownership": "Pertamina EP",
        "artificial_lift": {
          "activity_type": "installation",
          "action_mode": "installation_update",
          "method": "electric_submersible_pump",
          "assigned_department": "Production Operations",
          "frequency": 0,
          "electric_current": 0,
          "owned_by": "owned",
          "asset_number": "AST-ESP-0007",
          "production": 300,
          "pressure": 180
        }
      }
  auth:
    type: bearer
    token: "{{ssdp_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Submit OK (waiting_review)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
              "record_state": "submitted",
              "approval_status": "waiting_review",
              "work_order_number": "0005/WO/SDA1/2026"
            },
            "status": "success",
            "code": "00",
            "message": "Submit action plan PEP succeed"
          }
  - name: frequency = 0 dan electric_current = 0 diterima (angka, bukan kosong)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
              "record_state": "submitted",
              "approval_status": "waiting_review",
              "work_order_number": "0005/WO/SDA1/2026"
            },
            "status": "success",
            "code": "00",
            "message": "Submit action plan PEP succeed"
          }
  - name: frequency null / tidak dikirim (400)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "status": "failed",
            "code": "01",
            "message": "artificial_lift.frequency is required"
          }
  - name: electric_current negatif (400)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "status": "failed",
            "code": "01",
            "message": "artificial_lift.electric_current must be 0 or more"
          }
  - name: owned_by kosong (400)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "status": "failed",
            "code": "01",
            "message": "artificial_lift.owned_by must be rental or owned"
          }
  - name: pic_ids kosong (400)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "status": "failed",
            "code": "01",
            "message": "pic_ids needs at least one PIC for method electric_submersible_pump"
          }
  - name: activity_type adjustment (400)
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/submit"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "status": "failed",
            "code": "01",
            "message": "artificial_lift.activity_type must be installation for method electric_submersible_pump"
          }

docs: |
  **Hanya PEP, hanya installation** (`installation_schedule` / `installation_update`). Selalu masuk approval PO
  (`approval_status = waiting_review`), sama seperti WHC installation. `adjustment` → 400. PHSS → 400.

  **Field bersama**
  - `wo_number`: dari `GET /api/v1/well-surveilence/action-plans/next-wo-number` (opsional).
  - `pic_ids` wajib minimal 1. `artificial_lift.assigned_department` ("Assign to") wajib.
  - `owned_by` wajib: `rental` | `owned`. `contract_number` (free text) hanya untuk `rental`, `asset_number` hanya untuk `owned`.
  - `production`, `pressure` wajib, >= 0.

  **Field ESP** (`method = electric_submersible_pump`, PHI-2496):
  - `frequency` dan `electric_current` WAJIB, >= 0.
  - **Default FE = `0`. `0` adalah angka, BUKAN boolean / kosong.** Backend cek `null`, bukan falsy:
    `0` diterima dan disimpan `0`; hanya `null` / tidak dikirim yang 400.
  - Field SRP (`stroke_length`, `spmfreq`, `power`, `pump_type`, `pump_brand`, `prime_mover_name`) dan field adjustment dibuang.
