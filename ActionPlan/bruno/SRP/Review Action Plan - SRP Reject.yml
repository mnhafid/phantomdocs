info:
  name: Review Action Plan - SRP Reject
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/v1/well-surveilence/action-plans/:source/:id/review"
  params:
    - name: source
      value: "pep"
      type: path
    - name: id
      value: "{{plan_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "decision": "reject",
        "remarks": "Unit pompa tidak tersedia",
        "approvers": [
          {
            "level": 1,
            "user_id": [
              "{{mgr_id}}"
            ]
          }
        ]
      }
  auth:
    type: bearer
    token: "{{po_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Reject
    request:
      url: "{{base_url}}/api/v1/well-surveilence/action-plans/:source/:id/review"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "data": {
