info:
  name: Get Action Plan PEP Detail - SRP
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/v1/well-surveilence/action-plans/pep/{{plan_id}}"
  auth:
    type: bearer
    token: "{{ssdp_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  `data.artificial_lift` mengembalikan field SRP: `pump_type`, `pump_brand`, `prime_mover_name`, `stroke_length`, `spmfreq`, `power`. `frequency` / `electric_current` = null.
